<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delphos — Captação WhatsApp</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#0d2b1e;--navy2:#1a3d2a;--green:#1db86a;--g2:#17a05c;--g3:#e8f9f0;
  --red:#dc2626;--yellow:#d97706;--blue:#2563eb;--purple:#7c3aed;--cyan:#0891b2;--orange:#ea580c;
  --bg:#f0f4f2;--white:#fff;--brd:#dde8e2;--brd2:#e5e7eb;
  --tx:#0d1f14;--tx2:#374151;--tx3:#6b7280;--tx4:#9ca3af;
  --sh:0 1px 4px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);--sh2:0 4px 20px rgba(0,0,0,.10);
}
body{font-family:"Open Sans",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.hdr{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);height:64px;padding:0 28px;display:flex;align-items:center;position:sticky;top:0;z-index:200;box-shadow:0 2px 16px rgba(0,0,0,.3)}
.hdr-brand{display:flex;align-items:center;gap:10px;padding-right:24px;border-right:1px solid rgba(255,255,255,.1)}
.hdr-logo{width:36px;height:36px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:"Montserrat",sans-serif;font-weight:900;font-size:1rem;color:#fff}
.hdr-name{font-family:"Montserrat",sans-serif;font-weight:800;font-size:.95rem;color:#fff}
.hdr-name span{color:var(--green)}
.hdr-dept{font-size:.55rem;color:rgba(255,255,255,.38);text-transform:uppercase;letter-spacing:.1em;margin-top:1px}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.vbadge{background:rgba(29,184,106,.15);border:1px solid rgba(29,184,106,.3);border-radius:7px;padding:5px 12px;display:flex;align-items:center;gap:8px}
.vbadge-n{font-family:"Montserrat",sans-serif;font-size:1.5rem;font-weight:900;color:var(--green);line-height:1}
.vbadge-l{font-size:.5rem;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.07em;line-height:1.4}
.upd{font-size:.57rem;color:rgba(255,255,255,.28);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:4px;padding:3px 8px}
.cfg-btn{width:30px;height:30px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.8rem;transition:all .15s}
.cfg-btn:hover{border-color:var(--green)}

/* FILTER TOGGLE */
.ftoggle{background:var(--white);border-bottom:1px solid var(--brd);padding:0 28px;height:36px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;font-family:"Montserrat",sans-serif;font-size:.62rem;font-weight:700;color:var(--tx3)}
.ftoggle:hover{color:var(--navy)}
.ftoggle .ico{transition:transform .2s;font-size:.7rem}
.ftoggle.open .ico{transform:rotate(180deg)}
.fbar{background:var(--white);border-bottom:2px solid var(--brd);display:none}
.fbar.on{display:block}
.fline{display:flex;align-items:center;padding:6px 28px;gap:14px;border-bottom:1px solid var(--brd2);overflow-x:auto}
.fline:last-child{border-bottom:none}
.fline::-webkit-scrollbar{height:3px}.fline::-webkit-scrollbar-thumb{background:var(--green);border-radius:2px}
.fg{display:flex;align-items:center;gap:6px;flex-shrink:0}
.fl{font-family:"Montserrat",sans-serif;font-size:.57rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--tx3);white-space:nowrap}
.chip{padding:3px 10px;border-radius:20px;border:1.5px solid var(--brd);background:transparent;font-size:.62rem;font-weight:600;color:var(--tx2);cursor:pointer;transition:all .15s;white-space:nowrap;font-family:"Open Sans",sans-serif}
.chip:hover{border-color:var(--navy);color:var(--navy)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.fsep{width:1px;height:18px;background:var(--brd2);flex-shrink:0}
.fsel{border:1.5px solid var(--brd);border-radius:20px;background:var(--white);font-size:.62rem;font-weight:600;color:var(--tx2);padding:3px 9px;outline:none;cursor:pointer;max-width:150px;font-family:"Open Sans",sans-serif}
.fsel:focus{border-color:var(--green)}
.af-bar{background:var(--white);border-bottom:1px solid var(--brd);padding:5px 28px;display:none;align-items:center;gap:7px;flex-wrap:wrap}
.af-bar.on{display:flex}
.af-tag{background:var(--navy);color:#fff;border-radius:20px;padding:2px 9px;font-size:.6rem;font-weight:600;display:flex;align-items:center;gap:5px}
.af-tag .x{cursor:pointer;opacity:.6;font-size:.75rem}.af-tag .x:hover{opacity:1}
.clr-btn{margin-left:auto;padding:3px 10px;border-radius:5px;border:1.5px solid var(--brd);background:transparent;font-family:"Montserrat",sans-serif;font-size:.6rem;font-weight:700;color:var(--tx3);cursor:pointer;transition:all .15s}
.clr-btn:hover{border-color:var(--red);color:var(--red)}

.cnt{padding:18px 28px;display:flex;flex-direction:column;gap:14px}

/* KPI ROW */
.krow{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr 1fr;gap:10px}
.kk{background:var(--white);border-radius:10px;padding:15px 17px;box-shadow:var(--sh);border:1.5px solid var(--brd);position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s,border-color .15s;cursor:pointer}
.kk:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.kk.active{border-color:var(--navy)!important;box-shadow:0 0 0 2px rgba(13,43,30,.2)!important}
.kk-bar{position:absolute;top:0;left:0;right:0;height:4px;border-radius:10px 10px 0 0}
.kk-v{font-family:"Montserrat",sans-serif;font-size:2.1rem;font-weight:900;line-height:1;margin-bottom:2px}
.kk-l{font-size:.59rem;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em}
.kk-s{font-size:.56rem;color:var(--tx4);margin-top:2px}
.kk-hint{font-size:.5rem;color:var(--tx4);margin-top:4px}
.kk:hover .kk-hint{color:var(--green)}
.kk.dest{background:linear-gradient(135deg,var(--navy),var(--navy2));cursor:default}
.kk.dest .kk-v{color:var(--green)}.kk.dest .kk-l{color:rgba(255,255,255,.4)}.kk.dest .kk-s{color:rgba(255,255,255,.22)}

/* ALERT */
.alert-card{background:#fef2f2;border:1.5px solid #fecaca;border-radius:10px;padding:13px 17px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .15s}
.alert-card:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
.alert-card.active{box-shadow:0 0 0 2px var(--red)!important}
.alert-num{font-family:"Montserrat",sans-serif;font-size:2.6rem;font-weight:900;color:var(--red);line-height:1}
.alert-info .alert-lbl{font-family:"Montserrat",sans-serif;font-size:.78rem;font-weight:700;color:var(--tx)}
.alert-info .alert-sub{font-size:.62rem;color:var(--tx3);margin-top:2px}
.alert-hint{font-size:.6rem;color:var(--red);margin-top:5px;font-weight:600}

/* GRID */
.g2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.card{background:var(--white);border-radius:10px;padding:17px 19px;box-shadow:var(--sh);border:1px solid var(--brd)}
.ct{display:flex;align-items:center;gap:8px;margin-bottom:13px}
.ct .b{width:4px;height:17px;border-radius:2px;flex-shrink:0}
.ct-title{font-family:"Montserrat",sans-serif;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--navy)}

/* BARRAS HORIZONTAIS — clicáveis */
.hbi{display:flex;align-items:center;gap:9px;margin-bottom:7px;cursor:pointer;border-radius:6px;padding:2px 4px;transition:background .12s}
.hbi:hover{background:var(--bg)}
.hbi.on{background:var(--g3);border:1px solid var(--brd)}
.hbi-l{font-size:.62rem;color:var(--tx2);font-weight:500;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbi-bg{flex:1;background:var(--bg);border-radius:4px;height:20px;overflow:hidden}
.hbi-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:6px;font-size:.6rem;font-weight:700;color:#fff;transition:width .8s cubic-bezier(.4,0,.2,1)}
.hbi-n{font-family:"Montserrat",sans-serif;font-size:.7rem;font-weight:800;width:24px;text-align:right;color:var(--tx);flex-shrink:0}

/* DONUT */
.dw{display:flex;align-items:center;gap:18px}
.dl{display:flex;flex-direction:column;gap:9px;flex:1}
.di{display:flex;align-items:center;gap:7px;font-size:.63rem;cursor:pointer;border-radius:5px;padding:2px 4px;transition:background .12s}
.di:hover{background:var(--bg)}
.di.on{background:var(--g3)}
.dd{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.dv{margin-left:auto;font-family:"Montserrat",sans-serif;font-weight:800;font-size:.73rem}
.dp{font-size:.54rem;color:var(--tx3);margin-left:2px}

/* TABLE */
.tw{background:var(--white);border-radius:10px;box-shadow:var(--sh);border:1px solid var(--brd);overflow:hidden}
.tw-hd{padding:10px 17px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tw-t{display:flex;align-items:center;gap:7px}
.tw-t .b{width:4px;height:15px;border-radius:2px;background:var(--green)}
.tw-t span{font-family:"Montserrat",sans-serif;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--navy)}
.tw-c{font-size:.6rem;color:var(--tx3);background:var(--bg);border:1px solid var(--brd);border-radius:20px;padding:2px 8px;font-weight:600}
.tw-acts{margin-left:auto;display:flex;gap:5px}
.bsm{padding:4px 11px;border-radius:6px;border:1.5px solid var(--brd);background:var(--white);font-family:"Montserrat",sans-serif;font-size:.59rem;font-weight:700;cursor:pointer;color:var(--tx2);transition:all .15s}
.bsm:hover{border-color:var(--navy);color:var(--navy)}
.tsc{overflow-x:auto;max-height:340px;overflow-y:auto}
.tsc::-webkit-scrollbar{height:3px;width:3px}.tsc::-webkit-scrollbar-thumb{background:var(--green);border-radius:2px}
table.vt{width:100%;border-collapse:collapse;min-width:900px}
.vt th{font-size:.56rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em;padding:7px 9px;text-align:left;border-bottom:2px solid var(--brd);background:#f9fafb;font-weight:700;position:sticky;top:0;z-index:5;white-space:nowrap}
.vt td{font-size:.63rem;padding:7px 9px;border-bottom:1px solid var(--brd);color:var(--tx2)}
.vt tr:last-child td{border-bottom:none}
.vt tbody tr:hover td{background:#f9fafb}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:.57rem;font-weight:700}
.tag.sem{background:#fee2e2;color:var(--red)}
.tag.ok{background:#dcfce7;color:var(--g2)}
.tag.ex{background:#ede9fe;color:var(--purple)}
.tag.pcd{background:#fef3c7;color:var(--yellow)}

/* CFG */
.cfg-panel{position:fixed;bottom:54px;right:16px;background:var(--navy);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:13px;z-index:500;display:none;flex-direction:column;gap:7px;min-width:200px;box-shadow:var(--sh2)}
.cfg-panel.open{display:flex}
.cfg-t{font-size:.56rem;color:rgba(255,255,255,.32);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:2px}
.upl{display:flex;align-items:center;gap:6px;padding:7px 9px;background:rgba(29,184,106,.07);border:1.5px dashed rgba(29,184,106,.28);border-radius:6px;cursor:pointer;transition:all .15s}
.upl:hover{background:rgba(29,184,106,.14);border-color:var(--green)}
.upl input{display:none}
.upl span{font-size:.65rem;color:var(--green);font-weight:700}
.cfg-float{position:fixed;bottom:15px;right:15px;width:32px;height:32px;background:var(--navy);border:1px solid rgba(255,255,255,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.8rem;z-index:500;box-shadow:var(--sh2);transition:all .15s}
.cfg-float:hover{border-color:var(--green)}
footer{text-align:center;padding:9px;font-size:.57rem;color:var(--tx4);border-top:1px solid var(--brd);background:var(--white);margin-top:8px}
.empty-state{text-align:center;padding:48px 20px;color:var(--tx3)}
.empty-state .ico{font-size:2.5rem;margin-bottom:12px}
.empty-state .msg{font-family:"Montserrat",sans-serif;font-weight:700;font-size:.85rem;margin-bottom:6px}
.empty-state .sub{font-size:.7rem;color:var(--tx4)}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-brand">
    <div class="hdr-logo">D</div>
    <div>
      <div class="hdr-name">DEL<span>PHOS</span></div>
      <div class="hdr-dept">Captação WhatsApp</div>
    </div>
  </div>
  <div class="hdr-r">
    <div class="vbadge"><div class="vbadge-n" id="totalLeads">–</div><div class="vbadge-l">Leads<br>Totais</div></div>
    <div class="upd" id="updTag">⚠️ Carregue captacao.csv</div>
    <div class="cfg-btn" id="cfgIco">⚙️</div>
  </div>
</div>

<!-- FILTROS -->
<div class="ftoggle" id="ftoggle" onclick="toggleFilters()">
  <span>🔽 Filtros</span>
  <div id="afTags" style="display:flex;gap:5px;flex-wrap:wrap"></div>
  <button class="clr-btn" onclick="event.stopPropagation();clearAll()">✕ Limpar</button>
  <span class="ico">▼</span>
</div>
<div class="fbar" id="fbar">
  <div class="fline">
    <div class="fg">
      <span class="fl">Status</span>
      <button class="chip on" data-f="st" data-v="">Todos</button>
      <button class="chip" data-f="st" data-v="sem">⚠️ Sem contato</button>
      <button class="chip" data-f="st" data-v="com">Em contato</button>
      <button class="chip" data-f="st" data-v="entrevista">Com entrevista</button>
    </div>
    <div class="fsep"></div>
    <div class="fg">
      <span class="fl">Ex-Colaborador</span>
      <button class="chip on" data-f="ex" data-v="">Todos</button>
      <button class="chip" data-f="ex" data-v="sim">✅ Sim</button>
      <button class="chip" data-f="ex" data-v="nao">Não</button>
    </div>
  </div>
  <div class="fline">
    <div class="fg"><span class="fl">Região</span><select class="fsel" id="selReg"><option value="">Todas</option></select></div>
    <div class="fsep"></div>
    <div class="fg"><span class="fl">Cargo</span><select class="fsel" id="selCargo"><option value="">Todos</option></select></div>
    <div class="fsep"></div>
    <div class="fg"><span class="fl">Fonte</span><select class="fsel" id="selFonte"><option value="">Todas</option></select></div>
    <div class="fsep"></div>
    <div class="fg"><span class="fl">Disponibilidade</span><select class="fsel" id="selDisp"><option value="">Todas</option></select></div>
  </div>
</div>

<div id="mainContent">
  <div class="empty-state" id="emptyState">
    <div class="ico">📱</div>
    <div class="msg">Nenhum dado carregado</div>
    <div class="sub">Clique em ⚙️ para carregar o captacao.csv</div>
  </div>
</div>

<div class="cfg-float" id="cfgBtn">⚙️</div>
<div class="cfg-panel" id="cfgPanel">
  <div class="cfg-t">Atualizar Dados</div>
  <label class="upl"><input type="file" accept=".csv" onchange="loadCSV(this)"><span>⬆ Carregar captacao.csv</span></label>
</div>
<footer>Delphos Serviços e Segurança · Captação WhatsApp · v1.0 · Atualize via ⚙️</footer>

<script>
var RAW = [];
var F = {st:'',ex:'',reg:'',cargo:'',fonte:'',disp:''};
var FOPEN = false;

var FONTE_COL = {'Whatsapp Delphos':'#1db86a','Página Trabalhe Conosco':'#2563eb','Indicação':'#7c3aed','Facebook':'#0891b2','Panfleto':'#d97706','Indeed':'#dc2626','LinkedIn':'#1d4ed8','Google':'#ea4335','Grupos WhatsApp':'#059669','Outros':'#9ca3af'};
var REG_COLS  = ['#2563eb','#1d4ed8','#1e40af','#1e3a8a','#164e63','#155e75','#0891b2','#06b6d4','#0e7490','#0d9488'];
var CARGO_COLS= ['#7c3aed','#6d28d9','#5b21b6','#1d4ed8','#dc2626','#0891b2','#d97706','#059669'];

function normFonte(s){
  if(!s||!s.trim())return 'Outros'; s=s.trim(); var r=s.toLowerCase();
  if(r.includes('whatsapp')&&r.includes('delphos'))return 'Whatsapp Delphos';
  if(r.includes('trabalhe')||r.includes('página')||r.includes('pagina'))return 'Página Trabalhe Conosco';
  if(r.includes('indicaç')||r.includes('amigo')||r.includes('colega'))return 'Indicação';
  if(r.includes('facebook'))return 'Facebook';
  if(r.includes('panfleto')||r.includes('ombrolene'))return 'Panfleto';
  if(r.includes('indeed')||r.includes('ideed'))return 'Indeed';
  if(r.includes('linkedin'))return 'LinkedIn';
  if(r.includes('google')||r.includes('pesquisei'))return 'Google';
  if(r.includes('grupo')||r.includes('whatsapp'))return 'Grupos WhatsApp';
  return 'Outros';
}
function normCargo(s){
  if(!s||!s.trim())return 'Outros'; var r=s.trim().toLowerCase();
  if(r.includes('vigilant'))return 'Vigilante';
  if(r.includes('vigia'))return 'Vigia';
  if(r.includes('limpeza'))return 'Aux. Limpeza';
  if(r.includes('serviços gerais'))return 'Aux. Serv. Gerais';
  if(r.includes('controlador')||r.includes('portaria')||r.includes('porteiro'))return 'Controlador/Porteiro';
  if(r.includes('adm')||r.includes('jurídico')||r.includes('recepcion'))return 'ADM';
  if(r.includes('jardineiro')||r.includes('manut')||r.includes('zelad'))return 'Facilities/Manut.';
  return 'Outros';
}
function normRegiao(s){
  if(!s||!s.trim())return 'Não informada'; s=s.trim(); var r=s.toLowerCase();
  if(r.includes('jundiai')||r.includes('jundiaí'))return 'Jundiaí';
  if(r.includes('campinas'))return 'Campinas';
  if(r.includes('são paulo')||r.includes('sao paulo'))return 'São Paulo';
  if(r.includes('varzea')||r.includes('várzea'))return 'Várzea Paulista';
  if(r.includes('franco'))return 'Franco da Rocha';
  if(r.includes('francisco morato'))return 'Francisco Morato';
  if(r.includes('campo limpo'))return 'Campo Limpo Paulista';
  if(r.includes('itatiba'))return 'Itatiba';
  if(r.includes('cabreúva')||r.includes('cabreuva'))return 'Cabreúva';
  if(r.includes('sorocaba'))return 'Sorocaba';
  return s;
}
function hasContact(r){return r['RESPONSÁVEL']&&r['RESPONSÁVEL'].trim()!==''}
function hasInterview(r){var e=(r['ENTREVISTA']||'').trim();return e!==''&&e!=='*'}
function getStatus(r){if(!hasContact(r))return 'sem';if(hasInterview(r))return 'entrevista';return 'com';}
function isEx(r){return(r['EX-COLABORADOR']||'').trim().toUpperCase()==='SIM'}
function isPcd(r){var v=r['Você se considera uma Pessoa com Deficiência (PcD)?']||r['PCD']||'';return v.trim().toUpperCase()==='SIM'}

function filterBy(key,val){if(F[key]===val)F[key]='';else F[key]=val;updateAF();render();}
function updateAF(){
  var labels={st:{sem:'Sem contato',com:'Em contato',entrevista:'Com entrevista'},ex:{sim:'Ex-colaborador',nao:'Não ex-colab'},reg:'Região',cargo:'Cargo',fonte:'Fonte',disp:'Disponibilidade'};
  var tags=[];
  Object.keys(F).forEach(function(k){
    if(F[k]){var lbl=typeof labels[k]==='object'?(labels[k][F[k]]||F[k]):labels[k]+': '+F[k];
    tags.push('<span class="af-tag">'+lbl+'<span class="x" onclick="filterBy(\''+k+'\',\''+F[k]+'\')">✕</span></span>');}
  });
  document.getElementById('afTags').innerHTML=tags.join('');
}
function clearAll(){
  Object.keys(F).forEach(function(k){F[k]=''});
  document.querySelectorAll('.chip').forEach(function(b){b.classList.toggle('on',b.dataset.v==='')});
  ['selReg','selCargo','selFonte','selDisp'].forEach(function(id){document.getElementById(id).value=''});
  document.getElementById('afTags').innerHTML='';
  render();
}
function toggleFilters(){FOPEN=!FOPEN;document.getElementById('fbar').classList.toggle('on',FOPEN);document.getElementById('ftoggle').classList.toggle('open',FOPEN);}

function getFiltered(){
  return RAW.filter(function(r){
    if(F.st&&getStatus(r)!==F.st)return false;
    if(F.ex==='sim'&&!isEx(r))return false;
    if(F.ex==='nao'&&isEx(r))return false;
    if(F.reg&&normRegiao(r['REGIÃO'])!==F.reg)return false;
    if(F.cargo&&normCargo(r['INTERESSE'])!==F.cargo)return false;
    if(F.fonte&&normFonte(r['COMO SOUBE'])!==F.fonte)return false;
    if(F.disp&&(r['DISPONIBILIDADE']||'Não informado')!==F.disp)return false;
    return true;
  });
}

function buildSelects(){
  function fill(id,arr,key){
    var el=document.getElementById(id);el.innerHTML='<option value="">Todas</option>';
    arr.forEach(function(v){var o=document.createElement('option');o.value=v;o.text=v;el.appendChild(o)});
    el.onchange=function(ev){F[key]=ev.target.value;updateAF();render()};
  }
  var regs=[...new Set(RAW.map(function(r){return normRegiao(r['REGIÃO'])}).filter(Boolean))].sort();
  var cargos=[...new Set(RAW.map(function(r){return normCargo(r['INTERESSE'])}).filter(Boolean))].sort();
  var fontes=[...new Set(RAW.map(function(r){return normFonte(r['COMO SOUBE'])}).filter(Boolean))].sort();
  var disps=[...new Set(RAW.map(function(r){return r['DISPONIBILIDADE']||'Não informado'}).filter(Boolean))].sort();
  fill('selReg',regs,'reg');fill('selCargo',cargos,'cargo');fill('selFonte',fontes,'fonte');fill('selDisp',disps,'disp');
}

function render(){
  if(RAW.length===0)return;
  document.getElementById('emptyState').style.display='none';
  var d=getFiltered();
  document.getElementById('totalLeads').textContent=RAW.length;
  renderKPIs();renderAlert();renderCharts();renderTable(d);
}

function renderKPIs(){
  var total=RAW.length;
  var sem=RAW.filter(function(r){return!hasContact(r)}).length;
  var comC=RAW.filter(function(r){return hasContact(r)&&!hasInterview(r)}).length;
  var comE=RAW.filter(hasInterview).length;
  var ex=RAW.filter(isEx).length;
  var pcd=RAW.filter(isPcd).length;
  document.getElementById('krow').innerHTML=[
    {cls:'dest',key:null,v:total,l:'Total de Leads',s:'formulários recebidos',bar:'var(--green)'},
    {cls:'',key:'st',val:'sem',v:sem,l:'Aguardando Contato',s:'sem responsável',bar:'var(--red)'},
    {cls:'',key:'st',val:'com',v:comC,l:'Em Contato',s:'responsável atribuído',bar:'var(--yellow)'},
    {cls:'',key:'st',val:'entrevista',v:comE,l:'Entrevistas',s:'agendadas/realizadas',bar:'var(--blue)'},
    {cls:'',key:'ex',val:'sim',v:ex,l:'Ex-Colaboradores',s:'retornando à Delphos',bar:'var(--purple)'},
    {cls:'',key:null,v:pcd,l:'Candidatos PcD',s:'diversidade e inclusão',bar:'var(--cyan)'},
  ].map(function(k){
    var isAct=k.key&&F[k.key]===k.val;
    var oc=k.key?'onclick="filterBy(\''+k.key+'\',\''+k.val+'\')"':'';
    return '<div class="kk '+k.cls+(isAct?' active':'')+'" '+oc+'>'+
      '<div class="kk-bar" style="background:'+k.bar+'"></div>'+
      '<div class="kk-v">'+k.v+'</div>'+
      '<div class="kk-l">'+k.l+'</div>'+
      '<div class="kk-s">'+k.s+'</div>'+
      (k.key?'<div class="kk-hint">👆 clique para filtrar</div>':'')+
      '</div>';
  }).join('');
}

function renderAlert(){
  var n=RAW.filter(function(r){return!hasContact(r)}).length;
  document.getElementById('alertCard').classList.toggle('active',F.st==='sem');
  document.getElementById('alertNum').textContent=n;
}

function hbar(items,colors,maxW,key){
  var max=Math.max.apply(null,items.map(function(i){return i[1]}).concat([1]));
  return items.map(function(item,idx){
    var col=Array.isArray(colors)?colors[idx%colors.length]:colors;
    var isAct=key&&F[key]===item[0];
    var oc=key?'onclick="filterBy(\''+key+'\',\''+item[0]+'\')"':'';
    return '<div class="hbi'+(isAct?' on':'')+'" '+oc+' style="--lw:'+maxW+'px">'+
      '<div class="hbi-l" style="width:'+maxW+'px" title="'+item[0]+'">'+item[0]+'</div>'+
      '<div class="hbi-bg"><div class="hbi-fill" style="width:'+(item[1]/max*100)+'%;background:'+col+'">'+item[1]+'</div></div>'+
      '<div class="hbi-n">'+item[1]+'</div></div>';
  }).join('');
}
function topN(obj,n){return Object.entries(obj).sort(function(a,b){return b[1]-a[1]}).slice(0,n)}

function renderCharts(){
  var regs={},cargos={},fontes={},disps={};
  RAW.forEach(function(r){
    var rg=normRegiao(r['REGIÃO']);regs[rg]=(regs[rg]||0)+1;
    var ca=normCargo(r['INTERESSE']);cargos[ca]=(cargos[ca]||0)+1;
    var fo=normFonte(r['COMO SOUDE']||r['COMO SOUBE']);fontes[fo]=(fontes[fo]||0)+1;
    var di=r['DISPONIBILIDADE']||'Não informado';disps[di]=(disps[di]||0)+1;
  });
  document.getElementById('barRegiao').innerHTML=hbar(topN(regs,10),REG_COLS,130,'reg');
  document.getElementById('barCargo').innerHTML=hbar(topN(cargos,8),CARGO_COLS,130,'cargo');

  // Donut fonte
  var tot=RAW.length||1,ents=Object.entries(fontes).sort(function(a,b){return b[1]-a[1]});
  var ang=-Math.PI/2,cx=60,cy=60,r=50,ir=28,paths='';
  ents.forEach(function(item){
    var s=item[0],n=item[1],a=(n/tot)*2*Math.PI;
    var x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang);
    var x2=cx+r*Math.cos(ang+a),y2=cy+r*Math.sin(ang+a);
    var ix1=cx+ir*Math.cos(ang),iy1=cy+ir*Math.sin(ang);
    var ix2=cx+ir*Math.cos(ang+a),iy2=cy+ir*Math.sin(ang+a);
    var lg=a>Math.PI?1:0,col=FONTE_COL[s]||'#9ca3af';
    paths+='<path d="M'+ix1+','+iy1+' L'+x1+','+y1+' A'+r+','+r+' 0 '+lg+' 1 '+x2+','+y2+' L'+ix2+','+iy2+' A'+ir+','+ir+' 0 '+lg+' 0 '+ix1+','+iy1+'" fill="'+col+'" style="cursor:pointer" onclick="filterBy(\'fonte\',\''+s+'\')" />';
    ang+=a;
  });
  document.getElementById('donutFonte').innerHTML=paths+
    '<text x="60" y="56" text-anchor="middle" fill="#0d1f14" font-size="11" font-weight="700" font-family="Montserrat">'+RAW.length+'</text>'+
    '<text x="60" y="66" text-anchor="middle" fill="#6b7280" font-size="7">leads</text>';
  document.getElementById('legFonte').innerHTML=ents.slice(0,6).map(function(item){
    var pct=Math.round(item[1]/tot*100),isAct=F.fonte===item[0];
    return '<div class="di'+(isAct?' on':'')+'" onclick="filterBy(\'fonte\',\''+item[0]+'\')">'+
      '<div class="dd" style="background:'+(FONTE_COL[item[0]]||'#9ca3af')+'"></div>'+
      '<span style="color:#374151;font-size:.6rem">'+item[0]+'</span>'+
      '<span class="dv" style="color:'+(FONTE_COL[item[0]]||'#374151')+'">'+item[1]+'</span>'+
      '<span class="dp">'+pct+'%</span></div>';
  }).join('');

  // Status bar
  var sem=RAW.filter(function(r){return!hasContact(r)}).length;
  var comE=RAW.filter(hasInterview).length;
  var comC=RAW.filter(function(r){return hasContact(r)&&!hasInterview(r)}).length;
  var mx=Math.max(sem,comC,comE,1);
  document.getElementById('barStatus').innerHTML=[
    {k:'sem',l:'Sem contato',v:sem,c:'var(--red)'},
    {k:'com',l:'Em contato',v:comC,c:'var(--yellow)'},
    {k:'entrevista',l:'Entrevistado',v:comE,c:'var(--green)'},
  ].map(function(item){
    var isAct=F.st===item.k;
    return '<div class="hbi'+(isAct?' on':'')+'" onclick="filterBy(\'st\',\''+item.k+'\')">'+
      '<div class="hbi-l" style="width:110px">'+item.l+'</div>'+
      '<div class="hbi-bg"><div class="hbi-fill" style="width:'+(item.v/mx*100)+'%;background:'+item.c+'">'+item.v+'</div></div>'+
      '<div class="hbi-n">'+item.v+'</div></div>';
  }).join('');

  document.getElementById('barDisp').innerHTML=hbar(topN(disps,5),['#d97706','#2563eb','#7c3aed','#0891b2','#9ca3af'],120,'disp');

  var exS=RAW.filter(isEx).length;
  var naoS=RAW.filter(function(r){var v=(r['EX-COLABORADOR']||'').trim().toUpperCase();return v==='NÃO'||v==='NAO'}).length;
  var ni=RAW.length-exS-naoS;
  var mxEx=Math.max(exS,naoS,ni,1);
  document.getElementById('barEx').innerHTML=[
    {k:'nao',l:'Não colaborador',v:naoS,c:'var(--green)'},
    {k:'sim',l:'Ex-colaborador',v:exS,c:'var(--purple)'},
  ].map(function(item){
    var isAct=F.ex===item.k;
    return '<div class="hbi'+(isAct?' on':'')+'" onclick="filterBy(\'ex\',\''+item.k+'\')">'+
      '<div class="hbi-l" style="width:120px">'+item.l+'</div>'+
      '<div class="hbi-bg"><div class="hbi-fill" style="width:'+(item.v/mxEx*100)+'%;background:'+item.c+'">'+item.v+'</div></div>'+
      '<div class="hbi-n">'+item.v+'</div></div>';
  }).join('')+
  '<div class="hbi"><div class="hbi-l" style="width:120px">Não informado</div>'+
  '<div class="hbi-bg"><div class="hbi-fill" style="width:'+(ni/mxEx*100)+'%;background:#9ca3af">'+ni+'</div></div>'+
  '<div class="hbi-n">'+ni+'</div></div>';
}

function renderTable(d){
  document.getElementById('tblCnt').textContent=d.length+' candidatos';
  document.getElementById('tabela').innerHTML=
    '<thead><tr><th>#</th><th>Nome</th><th>Região</th><th>Interesse</th><th>Como Soube</th><th>Disponibilidade</th><th>Ex-Colab.</th><th>PcD</th><th>Responsável</th><th>Data</th><th>Entrevista</th><th>Observação</th></tr></thead><tbody>'+
    d.map(function(r,i){
      var semC=!hasContact(r);
      return '<tr style="'+(semC?'background:#fef9f9':'')+'">'+
        '<td style="color:var(--tx4);font-size:.59rem">'+(r['ID']||i+1)+'</td>'+
        '<td style="font-weight:600;color:var(--navy);white-space:nowrap">'+(r['NOME COMPLETO']||r['Nome']||'–')+'</td>'+
        '<td>'+normRegiao(r['REGIÃO'])+'</td>'+
        '<td style="max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="'+(r['INTERESSE']||'')+'">'+normCargo(r['INTERESSE'])+'</td>'+
        '<td>'+normFonte(r['COMO SOUDE']||r['COMO SOUBE'])+'</td>'+
        '<td>'+(r['DISPONIBILIDADE']||'–')+'</td>'+
        '<td>'+(isEx(r)?'<span class="tag ex">✅ Sim</span>':'<span style="color:var(--tx4);font-size:.6rem">Não</span>')+'</td>'+
        '<td>'+(isPcd(r)?'<span class="tag pcd">♿ Sim</span>':'<span style="color:var(--tx4);font-size:.6rem">Não</span>')+'</td>'+
        '<td>'+(semC?'<span class="tag sem">⚠️ Sem contato</span>':'<span class="tag ok">'+r['RESPONSÁVEL']+'</span>')+'</td>'+
        '<td style="font-family:Montserrat;font-size:.62rem">'+(r['DATA']||'–')+'</td>'+
        '<td>'+(hasInterview(r)?'<span class="tag ok">'+r['ENTREVISTA']+'</span>':'<span style="color:var(--tx4);font-size:.6rem">–</span>')+'</td>'+
        '<td style="max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.59rem;color:var(--tx4);font-style:italic" title="'+(r['OBS']||'')+'">'+(r['OBS']||'')+'</td>'+
        '</tr>';
    }).join('')+'</tbody>';
}

function loadCSV(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    parseCSV(e.target.result);
    document.getElementById('updTag').textContent='📅 '+new Date().toLocaleDateString('pt-BR');
    document.getElementById('cfgPanel').classList.remove('open');
  };
  reader.readAsText(file,'latin1');
}

function parseCSV(text){
  var lines=text.split('\n').filter(function(r){return r.trim()});
  var sep=lines[0].includes(';')?';':',';
  var hdr=lines[0].split(sep).map(function(h){return h.trim().replace(/^"|"$/g,'')});
  RAW=[];
  for(var i=1;i<lines.length;i++){
    var cols=lines[i].split(sep).map(function(c){return c.trim().replace(/^"|"$/g,'')});
    if(!cols[0])continue;
    var obj={};hdr.forEach(function(h,j){obj[h]=cols[j]||''});RAW.push(obj);
  }
  clearAll();buildSelects();
  // Inject HTML structure
  document.getElementById('mainContent').innerHTML =
    '<div class="cnt">'+
    '<div class="krow" id="krow"></div>'+
    '<div class="alert-card" id="alertCard" onclick="filterBy(\'st\',\'sem\')">'+
    '<div class="alert-num" id="alertNum">–</div>'+
    '<div class="alert-info"><div class="alert-lbl">⚠️ Candidatos aguardando contato</div>'+
    '<div class="alert-sub">Formulário preenchido mas sem responsável atribuído</div>'+
    '<div class="alert-hint">👆 Clique para ver estes candidatos na tabela</div></div></div>'+
    '<div class="g3">'+
    '<div class="card"><div class="ct"><div class="b" style="background:var(--blue)"></div><span class="ct-title">Por Região</span></div><div id="barRegiao"></div></div>'+
    '<div class="card"><div class="ct"><div class="b" style="background:var(--purple)"></div><span class="ct-title">Cargo de Interesse</span></div><div id="barCargo"></div></div>'+
    '<div class="card"><div class="ct"><div class="b" style="background:var(--cyan)"></div><span class="ct-title">Como Soube</span></div>'+
    '<div class="dw"><svg id="donutFonte" width="120" height="120" viewBox="0 0 120 120"></svg><div class="dl" id="legFonte"></div></div></div>'+
    '</div>'+
    '<div class="g3">'+
    '<div class="card"><div class="ct"><div class="b" style="background:var(--green)"></div><span class="ct-title">Status de Contato</span></div><div id="barStatus"></div></div>'+
    '<div class="card"><div class="ct"><div class="b" style="background:var(--yellow)"></div><span class="ct-title">Disponibilidade</span></div><div id="barDisp"></div></div>'+
    '<div class="card"><div class="ct"><div class="b" style="background:var(--purple)"></div><span class="ct-title">Ex-Colaboradores</span></div><div id="barEx"></div></div>'+
    '</div>'+
    '<div class="tw"><div class="tw-hd">'+
    '<div class="tw-t"><div class="b"></div><span>Lista de Candidatos</span></div>'+
    '<span class="tw-c" id="tblCnt">0</span>'+
    '<div class="tw-acts"><button class="bsm" onclick="clearAll()">✕ Limpar</button></div>'+
    '</div><div class="tsc"><table class="vt" id="tabela"></table></div></div>'+
    '</div>';
  render();
}

// Config
document.getElementById('cfgBtn').addEventListener('click',function(e){e.stopPropagation();document.getElementById('cfgPanel').classList.toggle('open')});
document.getElementById('cfgIco').addEventListener('click',function(e){e.stopPropagation();document.getElementById('cfgPanel').classList.toggle('open')});
document.addEventListener('click',function(e){
  if(!e.target.closest('#cfgBtn')&&!e.target.closest('#cfgPanel')&&!e.target.closest('#cfgIco'))
    document.getElementById('cfgPanel').classList.remove('open');
});
document.querySelectorAll('.chip').forEach(function(b){
  b.addEventListener('click',function(){
    var f=b.dataset.f,v=b.dataset.v;
    document.querySelectorAll('.chip[data-f="'+f+'"]').forEach(function(x){x.classList.remove('on')});
    b.classList.add('on');F[f]=v;updateAF();render();
  });
});

fetch('captacao.csv')
  .then(function(r){if(!r.ok)throw new Error('not found');return r.text()})
  .then(function(text){
    parseCSV(text);
    document.getElementById('updTag').textContent='📅 '+new Date().toLocaleDateString('pt-BR')+' (auto)';
  })
  .catch(function(){});
</script>
