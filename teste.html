<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Teste</title></head>
<body>
<h1 id="msg">Carregando...</h1>
<pre id="dados"></pre>
<script>
document.getElementById('msg').textContent = 'Tentando carregar vagas.csv...';
fetch('vagas.csv')
  .then(function(r){
    document.getElementById('msg').textContent = 'Status: ' + r.status + ' OK: ' + r.ok;
    return r.arrayBuffer();
  })
  .then(function(buf){
    var dec = new TextDecoder('windows-1252');
    var txt = dec.decode(buf);
    var linhas = txt.split('\n');
    document.getElementById('msg').textContent = 'SUCESSO! ' + linhas.length + ' linhas';
    document.getElementById('dados').textContent = linhas[0] + '\n' + linhas[1];
  })
  .catch(function(err){
    document.getElementById('msg').textContent = 'ERRO: ' + err;
  });
</script>
</body>
</html>
